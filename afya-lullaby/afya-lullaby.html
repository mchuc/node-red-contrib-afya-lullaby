<style>
  /* AFYA – common editor style (identical in all AFYA nodes) */
  .afya-form .form-row > label { width: 130px; }
  .afya-form .afya-section {
    display: flex; align-items: center; gap: 7px;
    margin: 18px 0 10px; padding-bottom: 5px;
    border-bottom: 1px solid var(--red-ui-secondary-border-color, #ddd);
    color: var(--red-ui-primary-text-color, #555);
    font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase;
  }
  .afya-form .afya-section > i { color: #3E9C86; width: 14px; text-align: center; }
  .afya-form .afya-hint { margin: -4px 0 12px 134px; font-size: 12px; line-height: 1.45; color: var(--red-ui-secondary-text-color, #888); }
  .afya-form .afya-hint code { font-size: 11px; }
  .afya-form .afya-check { display: flex; align-items: center; gap: 8px; margin: 0 0 12px 134px; }
  .afya-form .afya-check input { width: auto; margin: 0; }
  .afya-form .afya-check label { width: auto; margin: 0; cursor: pointer; }
  .afya-form .afya-unit { margin-left: 8px; color: var(--red-ui-secondary-text-color, #888); }
  .afya-form .afya-summary {
    display: flex; gap: 10px; align-items: flex-start;
    margin-top: 18px; padding: 10px 12px; border-radius: 6px;
    border-left: 4px solid #6CC1AD;
    background: var(--red-ui-tertiary-background, #f7f7f7);
    color: var(--red-ui-primary-text-color, #555); font-size: 12px; line-height: 1.55;
  }
  .afya-form .afya-summary > i { margin-top: 3px; color: #3E9C86; }
  .afya-form .afya-summary code { font-size: 11px; }
</style>

<script type="text/javascript">
  (function () {
    const randomName = (prefix) => prefix + Math.random().toString(36).slice(2, 7) + Date.now().toString().slice(-5);
    const plainKey = (v) => String(v || '').replace(/^#:\(\S+?\)::/, '');
    const nonNegative = (v) => /^\d+$/.test(String(v).trim());
    const TEXTS = {
      en: {
        name: 'Name', namePh: 'optional', lang: 'Labels', langAuto: 'system language ({l})',
        secDim: 'Dimming', start: 'Start value', stop: 'Stop value', step: 'Step', stepUnit: 'change per step', time: 'Time',
        dirHint: 'Start &gt; stop: dimming (falling asleep). Start &lt; stop: brightening (wake-up light).',
        fromPayload: 'Start from the number in <code>msg.payload</code> (e.g. the current brightness)',
        timeMode: 'Time from there', modeFixed: 'always the time above', modeRate: 'same speed – a shorter range takes less time',
        secVar: 'Context variable', variable: 'Variable',
        varHint: 'Holds <code>{ value, state, … }</code> of the current run. Choose <b>global</b> to read it from any flow.',
        sSame: 'Start and stop values must differ.', sDim: 'Dimming', sBright: 'Brightening',
        sRun: '<b>{a} → {b}</b> in <b>{time}</b>: {sign}{step} every {every} ({n} steps).',
        sPayload: 'A number in <code>msg.payload</code> (e.g. the current brightness) replaces the start value',
        sRate: ' – at the same speed, so e.g. {a} → {b} takes {time}.', sFixed: ' – it still takes {time}.',
        sKept: 'Current value is kept in {v}.', sNotKept: 'Current value is not stored in context.',
      },
      pl: {
        name: 'Nazwa', namePh: 'opcjonalnie', lang: 'Etykiety', langAuto: 'język systemu ({l})',
        secDim: 'Ściemnianie', start: 'Wartość startowa', stop: 'Wartość końcowa', step: 'Krok', stepUnit: 'zmiana w jednym kroku', time: 'Czas',
        dirHint: 'Start &gt; koniec: ściemnianie (zasypianie). Start &lt; koniec: rozjaśnianie (budzenie światłem).',
        fromPayload: 'Zacznij od liczby z <code>msg.payload</code> (np. bieżącej jasności)',
        timeMode: 'Czas od tego miejsca', modeFixed: 'zawsze czas podany wyżej', modeRate: 'ta sama prędkość – krótszy zakres trwa krócej',
        secVar: 'Zmienna kontekstu', variable: 'Zmienna',
        varHint: 'Przechowuje <code>{ value, state, … }</code> bieżącego przebiegu. Wybierz <b>global</b>, żeby czytać ją z każdego flow.',
        sSame: 'Wartość startowa i końcowa muszą się różnić.', sDim: 'Ściemnianie', sBright: 'Rozjaśnianie',
        sRun: '<b>{a} → {b}</b> w <b>{time}</b>: {sign}{step} co {every} ({n} kroków).',
        sPayload: 'Liczba z <code>msg.payload</code> (np. bieżąca jasność) zastępuje wartość startową',
        sRate: ' – z tą samą prędkością, więc np. {a} → {b} trwa {time}.', sFixed: ' – i nadal trwa {time}.',
        sKept: 'Bieżąca wartość jest trzymana w {v}.', sNotKept: 'Bieżąca wartość nie jest zapisywana w kontekście.',
      },
    };
    // --- AFYA: język opisów w oknie konfiguracji („Labels”): auto = polski tylko dla polskiego systemu,
    //     angielski dla wszystkich innych; zmieniają się tylko opisy – nigdy pola ani wartości.
    const afyaSystemLocale = function () {
      try {
        return localStorage.getItem('editor-language') || navigator.language || '';
      } catch (e) {
        return navigator.language || '';
      }
    };
    const afyaLang = function (setting) {
      if (setting === 'pl' || setting === 'en') return setting;
      return /^pl\b|^pl[-_]/i.test(afyaSystemLocale()) ? 'pl' : 'en';
    };
    /** Tłumaczy otwarte okno (data-t, data-t-ph, data-t-title) i zwraca T(klucz, zmienne) dla tekstów z kodu. */
    const afyaApplyLang = function (form, texts, setting) {
      const lang = afyaLang(setting);
      const T = function (k, v) {
        let s = (texts[lang] && texts[lang][k]) || texts.en[k] || k;
        Object.keys(v || {}).forEach(function (n) {
          s = s.split('{' + n + '}').join(v[n]);
        });
        return s;
      };
      form.find('[data-t]').each(function () {
        $(this).html(T($(this).attr('data-t')));
      });
      form.find('[data-t-ph]').each(function () {
        $(this).attr('placeholder', T($(this).attr('data-t-ph')));
      });
      form.find('[data-t-title]').each(function () {
        $(this).attr('title', T($(this).attr('data-t-title')));
      });
      form.find('#node-input-lang option[value="auto"]').text(T('langAuto', { l: afyaLang('auto') === 'pl' ? 'Polski' : 'English' }));
      return T;
    };

    function human(seconds) {
      let s = Number(seconds);
      if (!(s > 0)) return '–';
      const parts = [];
      const h = Math.floor(s / 3600); s -= h * 3600;
      const m = Math.floor(s / 60); s -= m * 60;
      if (h) parts.push(h + ' h');
      if (m) parts.push(m + ' min');
      if (s || !parts.length) parts.push(Math.round(s * 10) / 10 + ' s');
      return parts.join(' ');
    }

    RED.nodes.registerType('afya-lullaby', {
      category: 'AFYA',
      color: '#A6DCCF',
      paletteLabel: 'lullaby',
      icon: 'font-awesome/fa-moon-o',
      inputs: 1,
      outputs: 1,
      inputLabels: 'start (optionally the start value in msg.payload), or "stop" / "kill"',
      outputLabels: 'msg.payload = { value, state, direction, timestamp }',
      defaults: {
        name: { value: '' },
        lang: { value: 'auto' },
        dimmingTime: { value: 1200, required: true, validate: function (v) { return nonNegative(v) && Number(v) > 0; } },
        startValue: { value: 100, required: true, validate: nonNegative },
        stopValue: {
          value: 0,
          required: true,
          validate: function (v) {
            const start = $('#node-input-startValue').length ? $('#node-input-startValue').val() : this.startValue;
            return nonNegative(v) && Number(v) !== Number(start);
          },
        },
        step: { value: 1, required: true, validate: function (v) { return nonNegative(v) && Number(v) > 0; } },
        variableName: { value: '', required: false },
        scope: { value: 'global' },
        startFromPayload: { value: false },
        timeMode: { value: 'fixed' },
      },
      label: function () {
        return this.name || this.startValue + ' → ' + this.stopValue + ' in ' + human(this.dimmingTime);
      },
      labelStyle: function () {
        return this.name ? 'node_label_italic' : '';
      },
      oneditprepare: function () {
        if (['auto', 'en', 'pl'].indexOf(this.lang) < 0) $('#node-input-lang').val('auto'); // starsze węzły
        const form = $('#node-input-lang').closest('.afya-form');
        let T = afyaApplyLang(form, TEXTS, $('#node-input-lang').val());
        // nodes saved before 0.1.0 had no variable at all – they get one (global) when edited
        if (!this.scope) $('#node-input-scope').val('global');
        const name = $('#node-input-variableName');
        if (!plainKey(name.val())) name.val(randomName('AFYA_'));
        name.typedInput({ types: ['global', 'flow'], typeField: '#node-input-scope' });

        $('#node-input-dimmingTime').spinner({ min: 1, step: 60 });
        $('#node-input-startValue').spinner({ min: 0 });
        $('#node-input-stopValue').spinner({ min: 0 });
        $('#node-input-step').spinner({ min: 1 });

        const summary = function () {
          const time = Number($('#node-input-dimmingTime').val());
          const start = Number($('#node-input-startValue').val());
          const stop = Number($('#node-input-stopValue').val());
          const step = Math.max(1, Number($('#node-input-step').val()) || 1);
          $('#afya-lullaby-time-human').text('= ' + human(time));
          let text;
          if (start === stop) {
            text = '<b style="color: var(--red-ui-text-color-error, #AD1625)">' + T('sSame') + '</b>';
          } else {
            const steps = Math.max(1, Math.round(Math.abs(start - stop) / step));
            const every = time / steps;
            text = (start > stop ? '<i class="fa fa-moon-o"></i> ' + T('sDim') : '<i class="fa fa-sun-o"></i> ' + T('sBright')) + ' ' +
              T('sRun', { a: start, b: stop, time: human(time), sign: start > stop ? '−' : '+', step: step, every: human(every), n: steps });
            if ($('#node-input-startFromPayload').is(':checked')) {
              const half = Math.round((start + stop) / 2);
              text += '<br><i class="fa fa-sign-in"></i> ' + T('sPayload') + ($('#node-input-timeMode').val() === 'rate'
                ? T('sRate', { a: half, b: stop, time: human(time * Math.abs(half - stop) / Math.abs(start - stop)) })
                : T('sFixed', { time: human(time) }));
            }
            const key = plainKey(name.typedInput('value'));
            text += '<br>' + (key
              ? T('sKept', { v: '<code>' + name.typedInput('type') + '.' + $('<span>').text(key).html() + '</code>' })
              : T('sNotKept'));
          }
          $('#afya-lullaby-summary').html(text);
        };
        name.on('change', summary);
        $('#node-input-dimmingTime, #node-input-startValue, #node-input-stopValue, #node-input-step')
          .on('change keyup spin spinstop', function () { setTimeout(summary, 0); });
        $('#node-input-startFromPayload')
          .on('change', function () {
            $('.afya-lullaby-payload').toggle(this.checked);
            summary();
          })
          .trigger('change');
        $('#node-input-timeMode').on('change', summary);
        $('#node-input-lang').on('change', function () {
          T = afyaApplyLang(form, TEXTS, $(this).val());
          summary();
        });
        summary();
      },
    });
  })();
</script>

<script type="text/html" data-template-name="afya-lullaby">
  <div class="afya-form">
    <div class="form-row">
      <label for="node-input-name"><i class="fa fa-tag"></i> <span data-t="name">Name</span></label>
      <input type="text" id="node-input-name" data-t-ph="namePh" placeholder="optional" style="width: 65%;">
    </div>
    <div class="form-row">
      <label for="node-input-lang"><i class="fa fa-language"></i> <span data-t="lang">Labels</span></label>
      <select id="node-input-lang" style="width: 65%;">
        <option value="auto">system language</option>
        <option value="en">English</option>
        <option value="pl">Polski</option>
      </select>
    </div>

    <div class="afya-section"><i class="fa fa-sliders"></i> <span data-t="secDim">Dimming</span></div>
    <div class="form-row">
      <label for="node-input-startValue"><i class="fa fa-play"></i> <span data-t="start">Start value</span></label>
      <input type="text" id="node-input-startValue" style="width: 90px;">
    </div>
    <div class="form-row">
      <label for="node-input-stopValue"><i class="fa fa-stop"></i> <span data-t="stop">Stop value</span></label>
      <input type="text" id="node-input-stopValue" style="width: 90px;">
    </div>
    <div class="form-row">
      <label for="node-input-step"><i class="fa fa-arrows-v"></i> <span data-t="step">Step</span></label>
      <input type="text" id="node-input-step" style="width: 90px;">
      <span class="afya-unit" data-t="stepUnit">change per step</span>
    </div>
    <div class="form-row">
      <label for="node-input-dimmingTime"><i class="fa fa-clock-o"></i> <span data-t="time">Time</span></label>
      <input type="text" id="node-input-dimmingTime" style="width: 90px;">
      <span class="afya-unit">s <span id="afya-lullaby-time-human"></span></span>
    </div>
    <div class="afya-hint" data-t="dirHint">Start &gt; stop: dimming (falling asleep). Start &lt; stop: brightening (wake-up light).</div>
    <div class="afya-check">
      <input type="checkbox" id="node-input-startFromPayload">
      <label for="node-input-startFromPayload" data-t="fromPayload">Start from the number in <code>msg.payload</code> (e.g. the current brightness)</label>
    </div>
    <div class="form-row afya-lullaby-payload">
      <label for="node-input-timeMode"><i class="fa fa-tachometer"></i> <span data-t="timeMode">Time from there</span></label>
      <select id="node-input-timeMode" style="width: 65%;">
        <option value="fixed" data-t="modeFixed">always the time above</option>
        <option value="rate" data-t="modeRate">same speed – a shorter range takes less time</option>
      </select>
    </div>

    <div class="afya-section"><i class="fa fa-database"></i> <span data-t="secVar">Context variable</span></div>
    <div class="form-row">
      <label for="node-input-variableName"><i class="fa fa-globe"></i> <span data-t="variable">Variable</span></label>
      <input type="text" id="node-input-variableName" style="width: 65%;">
      <input type="hidden" id="node-input-scope">
    </div>
    <div class="afya-hint" data-t="varHint">Holds <code>{ value, state, … }</code> of the current run. Choose <b>global</b> to read it from any flow.</div>

    <div class="afya-summary"><i class="fa fa-info-circle"></i><span id="afya-lullaby-summary"></span></div>
  </div>
</script>

<script type="text/html" data-help-name="afya-lullaby">
  <p>Changes a value from <i>start</i> to <i>stop</i> in a given time – made for my children, to dim the light
    slowly while they fall asleep. Works the other way too, as a slow wake-up light.
    The node only calculates the value – connect <code>msg.payload.value</code> to your lamp.</p>

  <h3>Inputs</h3>
  <dl class="message-properties">
    <dt>payload <span class="property-type">any | number | "stop" | "kill"</span></dt>
    <dd>Any message starts the change (ignored while running). <code>stop</code> or <code>kill</code> stops it
      at the current value.<br>
      With <i>Start from the number in msg.payload</i>, a number (or numeric text) in <code>msg.payload</code> is
      the start value, e.g. the current brightness of the lamp – the direction follows from it (above the stop value:
      dimming, below: brightening). If it already equals the stop value, the node sends <code>end</code> at once.
      Anything else (text, object, a timestamp from a default <i>inject</i>) uses the configured start value.
      <i>Time from there</i>: <b>always the time above</b>, or <b>same speed</b> – e.g. 100 → 0 in 20 min means
      50 → 0 in 10 min.</dd>
  </dl>

  <h3>Outputs</h3>
  <dl class="message-properties">
    <dt>payload.value <span class="property-type">number</span></dt>
    <dd>Value to set.</dd>
    <dt>payload.state <span class="property-type">string</span></dt>
    <dd><code>counting</code> while running, <code>end</code> with the final (stop) value.</dd>
    <dt>payload.direction <span class="property-type">"down" | "up"</span></dt>
    <dd>Dimming or brightening.</dd>
    <dt>payload.timestamp <span class="property-type">number</span></dt>
    <dd>Time of the message (ms).</dd>
  </dl>

  <h3>Details</h3>
  <p>The current state (<code>value, state, direction, startValue, stopValue, startTime, stopTime</code>) is
    also written to a <b>global</b> or <b>flow</b> context variable after every step, so other flows can read it.
    <code>state</code> there can also be <code>killed</code> or <code>stopped</code> (redeploy).
    Nodes created before version 0.1.0 get the variable when you open and save them.</p>
  <p>Example: <a href="https://flows.nodered.org/flow/ce2fe16f73fc82e2760eaaadf28991b9" target="_blank">flows.nodered.org</a></p>

  <h3>Polski</h3>
  <p>Zmienia wartość od <i>start</i> do <i>stop</i> w zadanym czasie – do powolnego gaszenia światła przy
    zasypianiu dzieci albo budzenia światłem (start &lt; stop). Węzeł tylko liczy – użyj
    <code>msg.payload.value</code>. <code>msg.payload = "stop"</code> lub <code>"kill"</code> przerywa.
    Opcjonalnie zapisuje bieżący stan do zmiennej <b>global</b> lub <b>flow</b>.</p>
  <p>Opcja <i>Start from the number in msg.payload</i>: liczba w <code>msg.payload</code> (np. obecna jasność lampy)
    jest wartością startową. Czas: zawsze ustawiony albo ta sama prędkość (krótszy zakres – krócej).</p>

  <p><small>Marcin Chuć · MIT</small></p>
</script>
